[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinysd"
version = "0.0.1"
description = "A small wrapper around diffusers for Stable Diffusion 1.x and SDXL with A1111-style prompts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "torch",
    "diffusers",
    "transformers",
    "compel",
    "safetensors",
    "accelerate",
    "peft",
    "Pillow",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
